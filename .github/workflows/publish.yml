name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm publishes through the trusted publisher set up on npmjs.com for each package. That
      # needs npm 11.5.1 or later, newer than the one Node ships with, and no auth token in the
      # environment: setup-node's registry-url would write a placeholder one that npm would send.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run build
      - name: Create version pull request or publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish: npm run release
          version: npm run version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      # changeset publish creates the tags but the action does not push them any more, so the
      # tags and the GitHub releases (with the changelog sections as notes) are made here.
      - if: steps.changesets.outputs.published == 'true'
        run: git push --tags && node .github/scripts/github-releases.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

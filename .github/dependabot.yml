version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - '*'
    ignore:
      # three.js releases change the API every month; it moves on purpose, with a changeset.
      - dependency-name: three
      - dependency-name: '@types/three'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
